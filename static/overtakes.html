<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 Overtake Reel</title>
<style>
  :root {
    --bg:#0a0a0f; --panel:#15151f; --line:#2a2a3a; --red:#e10600;
    --text:#f2f2f7; --muted:#8a8a9a; --accent:#00d2be;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  header .bar { width:6px; height:28px; background:var(--red); border-radius:2px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header nav { margin-left:auto; display:flex; gap:16px; }
  header a { color:var(--muted); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--text); }
  main { max-width:1000px; margin:0 auto; padding:20px; }

  form { display:flex; gap:12px; align-items:end; flex-wrap:wrap;
         background:var(--panel); border:1px solid var(--line); padding:14px; border-radius:12px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
          color:var(--muted); margin-bottom:5px; }
  input, select { background:#0d0d14; border:1px solid var(--line); color:var(--text);
                  padding:8px 10px; border-radius:8px; font-size:14px; }
  input#event { width:140px; } input#year { width:80px; }
  button { background:var(--red); color:#fff; border:0; padding:9px 18px; border-radius:8px;
           font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }

  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .toggle input { width:auto; }

  #status { color:var(--muted); margin:16px 2px; min-height:20px; font-size:14px; }

  #stage { display:none; margin-top:16px; gap:18px; }
  #stage.show { display:grid; grid-template-columns:340px 1fr; }
  @media (max-width:760px) { #stage.show { grid-template-columns:1fr; } }

  /* --- overtake list (left column) --- */
  .reel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          max-height:620px; overflow-y:auto; }
  .reel-head { padding:10px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
               color:var(--muted); border-bottom:1px solid var(--line); position:sticky; top:0;
               background:var(--panel); }
  .ot { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer;
        border-bottom:1px solid #1d1d29; }
  .ot:hover { background:#1b1b27; }
  .ot.active { background:#20202e; box-shadow:inset 3px 0 0 var(--accent); }
  .ot.pit-row { display:none; }              /* hidden when "hide pit swaps" on */
  .reel.show-pit .ot.pit-row { display:flex; }
  .ot .lap { font-variant-numeric:tabular-nums; font-weight:700; width:34px; color:var(--muted);
             font-size:13px; }
  .ot .pass { flex:1; display:flex; align-items:center; gap:6px; font-size:13px; }
  .chip { padding:1px 7px; border-radius:5px; font-weight:700; font-size:12px; color:#fff;
          text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .ot .arrow { color:var(--muted); }
  .ot .pos { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pit-badge { font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:#ffb020;
               border:1px solid #6a4a10; border-radius:4px; padding:0 4px; }

  /* --- mini player (right column) --- */
  .player { display:flex; flex-direction:column; }
  .canvas-wrap { background:#08080d; border:1px solid var(--line); border-radius:12px;
                 position:relative; }
  canvas { width:100%; display:block; border-radius:12px; }
  .clock { position:absolute; top:14px; left:18px; font-variant-numeric:tabular-nums;
           font-size:20px; font-weight:700; letter-spacing:1px; }
  .clock small { display:block; font-size:11px; font-weight:400; color:var(--muted); letter-spacing:.5px; }
  .player .empty { color:var(--muted); text-align:center; padding:60px 20px; font-size:14px; }
  .controls { display:flex; align-items:center; gap:14px; margin-top:12px;
              background:var(--panel); border:1px solid var(--line); padding:10px 14px; border-radius:12px; }
  .controls button.play { width:40px; height:40px; border-radius:50%; font-size:15px; padding:0; }
  #scrub { flex:1; accent-color:var(--red); }
  .controls .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <h1>F1 OVERTAKE REEL</h1>
  <nav>
    <a href="/">← team radio</a>
    <a href="/track">track playback</a>
  </nav>
</header>

<main>
  <form id="f">
    <div><label>Year</label><input id="year" type="number" value="2024" /></div>
    <div><label>Event</label><input id="event" value="Brazil" /></div>
    <div><label>Session</label>
      <select id="session"><option>R</option><option>Sprint</option></select>
    </div>
    <button type="submit" id="load">Load</button>
    <label class="toggle"><input type="checkbox" id="hidepit" checked /> hide pit-stop swaps</label>
  </form>
  <div id="status">Detects on-track overtakes lap-by-lap, then replays each pass on a mini track-map. First load downloads laps (~5s), then it's cached.</div>

  <div id="stage">
    <!-- LEFT: clickable overtake reel -->
    <div class="reel" id="reel">
      <div class="reel-head" id="reelhead">overtakes</div>
      <div id="otlist"></div>
    </div>

    <!-- RIGHT: mini track-map player for the selected overtake -->
    <div class="player">
      <div class="canvas-wrap">
        <canvas id="c"></canvas>
        <div class="clock"><span id="clock">--:--</span><small id="evlabel">pick an overtake →</small></div>
        <div class="empty" id="empty">Click an overtake on the left to replay the pass.</div>
      </div>
      <div class="controls">
        <button class="play" id="play">▶</button>
        <input type="range" id="scrub" min="0" max="100" value="0" />
        <span class="lbl">replay window</span>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");

// ~6s replay window centred on the overtake's (approximate) session time.
const WINDOW = 6;            // seconds total
const HALF = WINDOW / 2;

let overtakeData = null;     // {event, overtakes:[...]}
let playback = null;         // /api/playback payload — fetched ONCE, cached client-side
let playbackKey = null;      // which session the cached playback is for
let view = null;             // coord transform for current bounds
let active = null;           // currently-selected overtake event
let winT0 = 0, winT1 = 0;    // session-time bounds of the active replay window
let vt = 0;                  // virtual session time being rendered
let playing = false, lastTs = 0;

// ---- load the overtake list -------------------------------------------------
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("load").disabled = true;
  $("status").textContent = "Detecting overtakes…";
  resetPlayer();
  const q = new URLSearchParams({ year:$("year").value, event:$("event").value, session:$("session").value });
  try {
    const res = await fetch("/api/overtakes?" + q);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    overtakeData = d;
    // New session → drop any cached playback from a previous one.
    const key = `${$("year").value}|${$("event").value}|${$("session").value}`;
    if (key !== playbackKey) { playback = null; playbackKey = key; }
    renderList(d);
    const total = d.overtakes.length;
    const nonpit = d.overtakes.filter(o => !o.pit).length;
    $("status").textContent = `${total} overtakes detected · ${nonpit} on-track · ${total - nonpit} pit-related`;
    $("stage").classList.add("show");
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  } finally {
    $("load").disabled = false;
  }
});

function renderList(d) {
  $("reelhead").textContent = `${d.event} ${d.year} · ${d.overtakes.length} overtakes`;
  const list = $("otlist");
  list.innerHTML = "";
  d.overtakes.forEach((o, idx) => {
    const row = document.createElement("div");
    row.className = "ot" + (o.pit ? " pit-row" : "");
    row.innerHTML =
      `<span class="lap">L${o.lap}</span>` +
      `<span class="pass">` +
        `<span class="chip" style="background:${o.gained.color}">${o.gained.code}</span>` +
        `<span class="arrow">▸</span>` +
        `<span class="chip" style="background:${o.lost.color}">${o.lost.code}</span>` +
        (o.pit ? `<span class="pit-badge">pit</span>` : ``) +
      `</span>` +
      `<span class="pos">P${o.posAfter}</span>`;
    row.addEventListener("click", () => selectOvertake(o, row));
    list.appendChild(row);
  });
  applyPitFilter();
}

// ---- "hide pit-stop swaps" toggle (pure CSS class flip) ---------------------
$("hidepit").addEventListener("change", applyPitFilter);
function applyPitFilter() {
  $("reel").classList.toggle("show-pit", !$("hidepit").checked);
}

// ---- select an overtake → fetch playback (once) → play the window ----------
async function selectOvertake(o, row) {
  document.querySelectorAll(".ot.active").forEach(r => r.classList.remove("active"));
  row.classList.add("active");
  active = o;
  $("evlabel").textContent = `L${o.lap} · ${o.gained.code} ▸ ${o.lost.code}`;

  if (o.sessionTime == null) {
    $("status").textContent = "This overtake has no timing anchor — can't replay it.";
    return;
  }

  // Lazily fetch the heavy playback payload the first time any row is clicked,
  // then reuse it for every subsequent overtake in this session.
  if (!playback) {
    $("empty").textContent = "Loading playback…";
    const q = new URLSearchParams({ year:$("year").value, event:$("event").value, session:$("session").value });
    try {
      const res = await fetch("/api/playback?" + q);
      const d = await res.json();
      if (d.error) throw new Error(d.error);
      playback = d;
    } catch (err) {
      $("empty").textContent = "Playback error: " + err.message;
      return;
    }
  }

  setupView();
  // Clamp the ~6s window to the playback's valid time range.
  const p = playback.playback;
  const tEnd = p.t0 + (p.frames - 1) * p.step;
  winT0 = Math.max(p.t0, o.sessionTime - HALF);
  winT1 = Math.min(tEnd, o.sessionTime + HALF);
  vt = winT0;
  $("empty").style.display = "none";
  resize();
  draw();
  // Auto-play the window so the pass animates on click.
  playing = true; lastTs = 0; $("play").textContent = "❚❚";
}

function resetPlayer() {
  active = null; playing = false; $("play").textContent = "▶";
  $("empty").style.display = ""; $("empty").textContent = "Click an overtake on the left to replay the pass.";
  $("clock").textContent = "--:--"; $("evlabel").textContent = "pick an overtake →";
}

// ---- coord transform (same idiom as track.html) ----------------------------
function setupView() {
  const [minx, miny, maxx, maxy] = playback.track.bounds;
  view = { minx, miny, maxx, maxy, w: maxx - minx, h: maxy - miny };
}
function resize() {
  if (!playback) return;
  const wrap = canvas.parentElement;
  const cssW = wrap.clientWidth;
  const aspect = view.h / view.w;
  const cssH = Math.min(cssW * aspect, 520);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  canvas.style.height = cssH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = 30;
  const scale = Math.min((cssW - 2*pad) / view.w, (cssH - 2*pad) / view.h);
  view.scale = scale;
  view.ox = (cssW - view.w * scale) / 2 - view.minx * scale;
  view.oy = (cssH - view.h * scale) / 2 - view.miny * scale;
}
const tx = x => x * view.scale + view.ox;
const ty = y => y * view.scale + view.oy;
const lerp = (a, b, f) => a + (b - a) * f;

function carPos(d, i0, i1, frac) {
  const x0 = d.x[i0], y0 = d.y[i0], x1 = d.x[i1], y1 = d.y[i1];
  if (x0 == null && x1 == null) return null;
  if (x0 == null) return [x1, y1];
  if (x1 == null) return [x0, y0];
  return [lerp(x0, x1, frac), lerp(y0, y1, frac)];
}

function draw() {
  if (!playback || !active) return;
  const p = playback.playback;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // track outline
  const line = playback.track.line;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "#2b2b3a"; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(tx(line[0][0]), ty(line[0][1]));
  for (const [x, y] of line) ctx.lineTo(tx(x), ty(y));
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = "#0d0d14"; ctx.lineWidth = 11; ctx.stroke();

  // frame for current vt
  const fFloat = (vt - p.t0) / p.step;
  let i0 = Math.max(0, Math.min(p.frames - 1, Math.floor(fFloat)));
  const i1 = Math.min(p.frames - 1, i0 + 1);
  const frac = Math.max(0, Math.min(1, fFloat - i0));

  const hi = new Set([active.gained.code, active.lost.code]);

  // Draw non-highlighted cars first (dimmed), so the two involved drivers sit on
  // top and read clearly as the pass.
  for (const [code, d] of Object.entries(p.drivers)) {
    if (hi.has(code)) continue;
    const pos = carPos(d, i0, i1, frac);
    if (!pos) continue;
    const cx = tx(pos[0]), cy = ty(pos[1]);
    ctx.globalAlpha = 0.28;
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 7);
    ctx.fillStyle = d.color; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Highlighted drivers: larger dots, white ring, big label. Note: a driver in
  // the overtake list may be absent from playback (e.g. an early crasher with no
  // GPS), so we just skip whichever side has no position — degrade, don't crash.
  for (const code of [active.lost.code, active.gained.code]) {  // gainer drawn last = on top
    const d = p.drivers[code];
    if (!d) continue;
    const pos = carPos(d, i0, i1, frac);
    if (!pos) continue;
    const cx = tx(pos[0]), cy = ty(pos[1]);
    ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7);
    ctx.fillStyle = d.color; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "700 13px sans-serif";
    ctx.fillText(code, cx + 14, cy + 4);
  }

  // clock (window-relative) + scrub
  $("clock").textContent = fmt(vt - winT0) + " / " + fmt(winT1 - winT0);
  $("scrub").value = ((vt - winT0) / Math.max(0.001, winT1 - winT0)) * 100;
}

function fmt(s) {
  s = Math.max(0, s); const sec = Math.floor(s % 60), ds = Math.floor((s * 10) % 10);
  return String(sec).padStart(2,"0") + "." + ds + "s";
}

// Animation loop: 1× real-time within the short window so the pass is legible.
function loop(ts) {
  if (playing && playback && active) {
    if (!lastTs) lastTs = ts;
    const dt = (ts - lastTs) / 1000; lastTs = ts;
    vt += dt;                         // real-time playback over a ~6s window
    if (vt >= winT1) { vt = winT1; playing = false; $("play").textContent = "▶"; }
    draw();
  } else { lastTs = 0; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$("play").addEventListener("click", () => {
  if (!active) return;
  // Pressing play after the window ended restarts it (replay).
  if (!playing && vt >= winT1) vt = winT0;
  playing = !playing; lastTs = 0;
  $("play").textContent = playing ? "❚❚" : "▶";
});
$("scrub").addEventListener("input", () => {
  if (!active) return;
  vt = winT0 + (+$("scrub").value / 100) * (winT1 - winT0);
  draw();
});
window.addEventListener("resize", () => { if (active) { resize(); draw(); } });
</script>
</body>
</html>
