<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 Radio AI</title>
<style>
  :root {
    --bg:#0a0a0f; --panel:#15151f; --line:#2a2a3a; --red:#e10600;
    --text:#f2f2f7; --muted:#8a8a9a; --accent:#00d2be;
    /* category + sentiment chip hues — hand-picked, no library */
    --strategy:#3a7bd5; --complaint:#d58a3a; --incident:#e10600;
    --celebration:#00d2be; --info:#7a7a9a; --other:#4a4a5a;
    --positive:#2ecc71; --neutral:#7a7a9a; --negative:#e15a5a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  header .bar { width:6px; height:28px; background:var(--red); border-radius:2px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header span { color:var(--muted); font-size:13px; }
  header nav { margin-left:auto; display:flex; gap:16px; }
  header nav a { color:var(--accent); text-decoration:none; font-size:13px; }
  main { max-width:880px; margin:0 auto; padding:24px 20px 60px; }

  form { display:grid; grid-template-columns:repeat(5,1fr) auto; gap:12px;
         align-items:end; background:var(--panel); border:1px solid var(--line);
         padding:18px; border-radius:12px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
          color:var(--muted); margin-bottom:6px; }
  input, select { width:100%; background:#0d0d14; border:1px solid var(--line); color:var(--text);
                  padding:9px 10px; border-radius:8px; font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { background:var(--red); color:#fff; border:0; padding:10px 18px; border-radius:8px;
           font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }

  #status { color:var(--muted); margin:18px 2px; min-height:20px; font-size:14px; }

  /* Degradation banner — THE visible signal that the LLM path didn't run.
     In degraded mode clean == raw, so without this the page looks like the LLM
     silently did nothing. */
  .banner { display:none; margin:16px 0; padding:11px 14px; border-radius:10px;
            background:#2a1f10; border:1px solid #6a4a1a; color:#e8c98a; font-size:13px; }
  .banner.show { display:block; }

  /* mood header */
  .mood { display:none; background:var(--panel); border:1px solid var(--line);
          border-radius:12px; padding:16px 18px; margin:16px 0 8px; }
  .mood.show { display:block; }
  .mood h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase;
             letter-spacing:.6px; color:var(--muted); }
  .mood .summary { font-size:15px; color:var(--text); margin-bottom:14px; line-height:1.45; }
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-row .key { width:96px; font-size:12px; color:var(--muted); text-transform:capitalize; }
  .bar-track { flex:1; height:18px; background:#0d0d14; border-radius:6px; overflow:hidden; display:flex; }
  .bar-seg { height:100%; display:flex; align-items:center; justify-content:center;
             font-size:11px; font-weight:700; color:#0a0a0f; min-width:0; }

  /* clip list */
  .clip { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:12px; }
  .clip .top { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .badge { background:var(--red); color:#fff; font-weight:700; font-size:13px;
           padding:3px 9px; border-radius:6px; letter-spacing:.5px; }
  .time { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  /* coloured pills for category + sentiment */
  .pill { font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
          letter-spacing:.4px; text-transform:capitalize; color:#0a0a0f; }
  .tldr { margin-left:auto; color:var(--muted); font-size:13px; font-style:italic; }
  audio { width:100%; height:34px; margin:6px 0 10px; }
  /* cleaned transcript — the prominent line */
  .clean { padding:11px 13px; background:#0d0d14; border-left:3px solid var(--accent);
           border-radius:6px; color:#eaeaf2; font-size:15px; }
  /* raw transcript — smaller, collapsible via <details> */
  details.raw { margin-top:8px; }
  details.raw summary { cursor:pointer; font-size:12px; color:var(--muted); list-style:none; }
  details.raw summary::-webkit-details-marker { display:none; }
  details.raw summary::before { content:"▸ "; }
  details.raw[open] summary::before { content:"▾ "; }
  details.raw .rawtext { margin-top:6px; padding:9px 11px; background:#0c0c12;
                         border-left:3px solid var(--line); border-radius:6px;
                         color:var(--muted); font-size:13px; }
  @media (max-width:720px) { form { grid-template-columns:1fr 1fr; } .tldr { margin-left:0; width:100%; } }
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <h1>F1 RADIO AI</h1>
  <span>Whisper + OpenRouter LLM cleanup &amp; tagging</span>
  <nav>
    <a href="/">← team radio</a>
    <a href="/track">track playback →</a>
  </nav>
</header>

<main>
  <form id="f">
    <div><label>Year</label><input id="year" type="number" value="2024" /></div>
    <div><label>Event</label><input id="event" value="Brazil" /></div>
    <div><label>Session</label>
      <select id="session">
        <option>R</option><option>Q</option><option>Sprint</option>
        <option>FP1</option><option>FP2</option><option>FP3</option>
      </select>
    </div>
    <div><label>Driver (opt)</label><input id="driver" placeholder="VER" value="VER" /></div>
    <div><label>LLM model</label><input id="model" placeholder="anthropic/claude-haiku-4-5-20251001" /></div>
    <button type="submit" id="load">Analyse</button>
  </form>

  <div id="status">Tip: a driver filter keeps it fast — first run transcribes every clip with Whisper (slow), then it's cached.</div>
  <div class="banner" id="banner"></div>

  <div class="mood" id="mood">
    <h2>Radio mood</h2>
    <div class="summary" id="moodSummary"></div>
    <div class="bars">
      <div class="bar-row"><span class="key">Category</span><div class="bar-track" id="catBar"></div></div>
      <div class="bar-row"><span class="key">Sentiment</span><div class="bar-track" id="sentBar"></div></div>
    </div>
  </div>

  <div id="list"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const CAT_VARS = { strategy:"--strategy", complaint:"--complaint", incident:"--incident",
                     celebration:"--celebration", info:"--info", other:"--other" };
  const SENT_VARS = { positive:"--positive", neutral:"--neutral", negative:"--negative" };
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    $("load").disabled = true;
    $("list").innerHTML = "";
    $("mood").classList.remove("show");
    $("banner").classList.remove("show");
    $("status").textContent = "Analysing… first run transcribes every clip (Whisper, can take a while), then caches.";

    const q = new URLSearchParams({
      year:$("year").value, event:$("event").value, session:$("session").value,
      driver:$("driver").value.trim(), model:$("model").value.trim(),
    });
    try {
      const res = await fetch("/api/radio-ai?" + q);   // no client timeout — Whisper is slow
      const d = await res.json();
      if (d.error) throw new Error(d.error);
      if (!d.count) { $("status").textContent = "No radio clips found for that session."; return; }
      $("status").textContent = `${d.count} clips · model ${d.model}`;

      // Degradation banner: surfaces llm_available:false plainly to the user.
      if (!d.llm_available) {
        $("banner").textContent = "⚠ LLM cleaning unavailable (no OPENROUTER_API_KEY) — showing RAW Whisper transcripts, tagged 'other / neutral'.";
        $("banner").classList.add("show");
      }

      renderMood(d.mood);
      d.clips.forEach(renderClip);
    } catch (err) {
      $("status").textContent = "Error: " + err.message;
    } finally {
      $("load").disabled = false;
    }
  });

  // Build a stacked proportional bar from a {key:count} map + a var lookup.
  function renderBar(el, counts, vars) {
    el.innerHTML = "";
    const total = Object.values(counts).reduce((a,b) => a+b, 0) || 1;
    for (const [k, n] of Object.entries(counts).sort((a,b) => b[1]-a[1])) {
      const seg = document.createElement("div");
      seg.className = "bar-seg";
      seg.style.background = cssVar(vars[k] || "--other");
      seg.style.width = (n/total*100) + "%";
      seg.title = `${k}: ${n}`;
      seg.textContent = n;          // hide the number on very thin segments
      if (n/total < 0.07) seg.textContent = "";
      el.appendChild(seg);
    }
  }

  function renderMood(mood) {
    $("moodSummary").textContent = mood.summary || "(no LLM summary — add an OpenRouter key for the emotional arc)";
    renderBar($("catBar"), mood.categories, CAT_VARS);
    renderBar($("sentBar"), mood.sentiments, SENT_VARS);
    $("mood").classList.add("show");
  }

  function renderClip(c) {
    const el = document.createElement("div");
    el.className = "clip";
    const time = c.utc ? new Date(c.utc).toLocaleTimeString() : "";
    const catColor = cssVar(CAT_VARS[c.category] || "--other");
    const sentColor = cssVar(SENT_VARS[c.sentiment] || "--neutral");
    // Only show the collapsible raw block when it differs from clean (i.e. the
    // LLM actually rewrote it); in degraded mode they're identical so we skip it.
    const showRaw = c.raw && c.raw !== c.clean;
    el.innerHTML = `
      <div class="top">
        <span class="badge">${c.code}</span>
        <span class="time">${time}</span>
        <span class="pill" style="background:${catColor}">${c.category}</span>
        <span class="pill" style="background:${sentColor}">${c.sentiment}</span>
        ${c.tldr ? `<span class="tldr">${c.tldr}</span>` : ""}
      </div>
      <audio controls preload="none" src="${c.url}"></audio>
      <div class="clean">${c.clean || "(no speech detected)"}</div>
      ${showRaw ? `<details class="raw"><summary>raw transcript</summary>
                   <div class="rawtext">${c.raw}</div></details>` : ""}`;
    $("list").appendChild(el);
  }
</script>
</body>
</html>
