<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 Mini-Sectors</title>
<style>
  :root {
    --bg:#0a0a0f; --panel:#15151f; --line:#2a2a3a; --red:#e10600;
    --text:#f2f2f7; --muted:#8a8a9a; --accent:#00d2be;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  header .bar { width:6px; height:28px; background:var(--red); border-radius:2px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header .nav { margin-left:auto; display:flex; gap:18px; }
  header a { color:var(--muted); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--text); }
  main { max-width:900px; margin:0 auto; padding:20px; }

  form { display:flex; gap:12px; align-items:end; flex-wrap:wrap;
         background:var(--panel); border:1px solid var(--line); padding:14px; border-radius:12px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
          color:var(--muted); margin-bottom:5px; }
  input, select { background:#0d0d14; border:1px solid var(--line); color:var(--text);
                  padding:8px 10px; border-radius:8px; font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  input#event { width:130px; } input#year { width:80px; }
  input#driver, input#driver2 { width:90px; text-transform:uppercase; }
  input#n { width:70px; }
  button { background:var(--red); color:#fff; border:0; padding:9px 18px; border-radius:8px;
           font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }

  #status { color:var(--muted); margin:16px 2px; min-height:20px; font-size:14px; }
  #stage { display:none; }
  #stage.show { display:block; }

  .legend { display:flex; gap:14px; margin:14px 2px 4px; flex-wrap:wrap; align-items:center; }
  .legend .chip { display:flex; align-items:center; gap:7px; font-size:13px; }
  .legend .sw { width:14px; height:14px; border-radius:3px; display:inline-block; }

  .track-wrap { background:#08080d; border:1px solid var(--line); border-radius:12px;
                padding:12px 14px; margin-top:8px; }
  .track-wrap h3 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
                   color:var(--muted); font-weight:600; }
  canvas { width:100%; display:block; }

  #sectorList { margin-top:14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
                gap:6px; }
  .sector-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);
                background:#08080d; border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .sector-row .sw { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  .sector-row b { color:var(--text); }
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <h1>F1 MINI-SECTORS</h1>
  <div class="nav">
    <a href="/">← team radio</a>
    <a href="/track">track playback</a>
  </div>
</header>

<main>
  <form id="f">
    <div><label>Year</label><input id="year" type="number" value="2024" /></div>
    <div><label>Event</label><input id="event" value="Brazil" /></div>
    <div><label>Session</label>
      <select id="session">
        <option>Q</option><option>R</option><option>Sprint</option>
        <option>FP1</option><option>FP2</option><option>FP3</option>
      </select>
    </div>
    <div><label>Driver (opt)</label><input id="driver" placeholder="VER" /></div>
    <div><label>Compare (opt)</label><input id="driver2" placeholder="NOR" /></div>
    <div><label>Sectors</label><input id="n" type="number" value="20" min="4" max="60" /></div>
    <button type="submit" id="load">Load</button>
  </form>
  <div id="status">Tip: leave both drivers blank to see the whole field's fastest driver per mini-sector.
    Fill both to see a head-to-head speed comparison instead.</div>

  <div id="stage">
    <div class="legend" id="legend"></div>
    <div class="track-wrap">
      <h3 id="track-title">Mini-sectors</h3>
      <canvas id="c-track"></canvas>
    </div>
    <div id="sectorList"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let data = null;

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("load").disabled = true;
  $("status").textContent = "Loading… (first time downloads telemetry, please wait)";
  const q = new URLSearchParams({
    year:$("year").value, event:$("event").value, session:$("session").value,
    n:$("n").value || 20,
  });
  const d1 = $("driver").value.trim(), d2 = $("driver2").value.trim();
  if (d1) q.set("driver", d1);
  if (d2) q.set("driver2", d2);
  try {
    const res = await fetch("/api/mini-sectors?" + q);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    data = d;
    const mode = d.meta.driver2 ? `${d.meta.driver} vs ${d.meta.driver2}` : `field · ref ${d.meta.ref}`;
    $("status").textContent = `${d.sectors.length} mini-sectors · ${mode}` + (d.cached ? "  · cached" : "  · freshly built");
    renderLegend();
    drawTrack();
    renderSectorList();
    $("stage").classList.add("show");
    requestAnimationFrame(drawTrack);
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  } finally {
    $("load").disabled = false;
  }
});

function renderLegend(){
  $("legend").innerHTML = data.legend.map(l =>
    `<span class="chip"><span class="sw" style="background:${l.color}"></span><b>${l.driver}</b></span>`).join("");
  $("track-title").textContent = data.meta.driver2
    ? `Mini-sectors — ${data.meta.driver} vs ${data.meta.driver2} (colour = who's faster)`
    : `Mini-sectors — coloured by fastest driver`;
}

function fitCanvas(cv, cssH){
  const cssW = cv.parentElement.clientWidth - 28;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, cssW) * dpr;
  cv.height = cssH * dpr;
  cv.style.height = cssH + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, w: Math.max(1, cssW), h: cssH };
}

function drawTrack(){
  const t = data.track;
  const cv = $("c-track");
  const [minx,miny,maxx,maxy] = t.bounds;
  const dw = maxx-minx, dh = maxy-miny;
  const cssW = cv.parentElement.clientWidth - 28;
  const cssH = Math.min(Math.max(220, cssW * (dh/dw)), 460);
  const { ctx, w, h } = fitCanvas(cv, cssH);
  ctx.clearRect(0,0,w,h);
  const pad = 18;
  const scale = Math.min((w-2*pad)/dw, (h-2*pad)/dh);
  const ox = (w - dw*scale)/2 - minx*scale, oy = (h - dh*scale)/2 - miny*scale;
  const X = x => x*scale + ox, Y = y => y*scale + oy;
  ctx.lineJoin = ctx.lineCap = "round"; ctx.lineWidth = 6;
  // Colour each drawn segment by the mini-sector its starting point belongs to.
  for (let i=1;i<t.x.length;i++){
    const sec = data.sectors[t.sector[i-1]];
    ctx.beginPath();
    ctx.moveTo(X(t.x[i-1]), Y(t.y[i-1]));
    ctx.lineTo(X(t.x[i]), Y(t.y[i]));
    ctx.strokeStyle = sec ? sec.color : "#888";
    ctx.stroke();
  }
}

function renderSectorList(){
  $("sectorList").innerHTML = data.sectors.map(s => {
    const label = s.winner ?? "—";
    const delta = s.delta != null ? ` (${s.delta>0?"+":""}${s.delta} km/h)` : "";
    return `<div class="sector-row"><span class="sw" style="background:${s.color}"></span>
      <span>#${s.i+1} <b>${label}</b>${delta}</span></div>`;
  }).join("");
}

window.addEventListener("resize", () => { if (data) drawTrack(); });
</script>
</body>
</html>
