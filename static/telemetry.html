<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 Telemetry</title>
<style>
  :root {
    --bg:#0a0a0f; --panel:#15151f; --line:#2a2a3a; --red:#e10600;
    --text:#f2f2f7; --muted:#8a8a9a; --accent:#00d2be;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  header .bar { width:6px; height:28px; background:var(--red); border-radius:2px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  /* Two nav links pushed to the right; first one carries the auto-margin. */
  header .nav { margin-left:auto; display:flex; gap:18px; }
  header a { color:var(--muted); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:20px; }

  form { display:flex; gap:12px; align-items:end; flex-wrap:wrap;
         background:var(--panel); border:1px solid var(--line); padding:14px; border-radius:12px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
          color:var(--muted); margin-bottom:5px; }
  input, select { background:#0d0d14; border:1px solid var(--line); color:var(--text);
                  padding:8px 10px; border-radius:8px; font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  input#event { width:130px; } input#year { width:80px; }
  input#driver, input#driver2 { width:90px; text-transform:uppercase; }
  input#lap { width:90px; }
  button { background:var(--red); color:#fff; border:0; padding:9px 18px; border-radius:8px;
           font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }

  #status { color:var(--muted); margin:16px 2px; min-height:20px; font-size:14px; }
  #stage { display:none; }
  #stage.show { display:block; }

  /* Legend chips show which colour is which driver in the line charts. */
  .legend { display:flex; gap:18px; margin:14px 2px 4px; flex-wrap:wrap; align-items:center; }
  .legend .chip { display:flex; align-items:center; gap:7px; font-size:13px; }
  .legend .sw { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .legend .t { color:var(--muted); font-variant-numeric:tabular-nums; }

  /* Layout: charts column on the left, track map on the right (stacks on narrow). */
  .grid { display:grid; grid-template-columns:1fr 420px; gap:16px; margin-top:8px; align-items:start; }
  @media (max-width:900px){ .grid { grid-template-columns:1fr; } }

  .panel { background:#08080d; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .panel + .panel { margin-top:14px; }
  .panel h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
              color:var(--muted); font-weight:600; }
  canvas { width:100%; display:block; }

  .track-wrap { background:#08080d; border:1px solid var(--line); border-radius:12px;
                padding:12px 14px; position:sticky; top:14px; }
  .track-wrap h3 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
                   color:var(--muted); font-weight:600; }
  /* Horizontal speed colour-bar so the blue→red mapping on the line is legible. */
  .colorbar { height:12px; border-radius:6px; margin-top:10px;
              background:linear-gradient(90deg,#2b6bff,#00d2be,#f2d600,#ff7a00,#e10600); }
  .colorbar-labels { display:flex; justify-content:space-between; font-size:11px;
                     color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <h1>F1 TELEMETRY</h1>
  <div class="nav">
    <a href="/">← team radio</a>
    <a href="/track">track playback</a>
  </div>
</header>

<main>
  <form id="f">
    <div><label>Year</label><input id="year" type="number" value="2024" /></div>
    <div><label>Event</label><input id="event" value="Brazil" /></div>
    <div><label>Session</label>
      <select id="session">
        <option>Q</option><option>R</option><option>Sprint</option>
        <option>FP1</option><option>FP2</option><option>FP3</option>
      </select>
    </div>
    <div><label>Driver</label><input id="driver" value="VER" /></div>
    <div><label>Compare (opt)</label><input id="driver2" placeholder="NOR" /></div>
    <div><label>Lap</label><input id="lap" value="fastest" /></div>
    <button type="submit" id="load">Load</button>
  </form>
  <div id="status">Tip: lap is "fastest" or a lap number. First load of a session downloads telemetry (~10–20s), then it's cached.</div>

  <div id="stage">
    <div class="legend" id="legend"></div>
    <div class="grid">
      <div id="charts">
        <!-- One panel per channel; all share the same distance x-axis so a
             vertical position reads across every chart. -->
        <div class="panel"><h3>Speed (km/h)</h3><canvas id="c-speed"></canvas></div>
        <div class="panel" id="p-delta" style="display:none"><h3>Speed delta (driver 1 − driver 2, km/h)</h3><canvas id="c-delta"></canvas></div>
        <div class="panel"><h3>Throttle (%)</h3><canvas id="c-throttle"></canvas></div>
        <div class="panel"><h3>Brake</h3><canvas id="c-brake"></canvas></div>
        <div class="panel"><h3>Gear</h3><canvas id="c-gear"></canvas></div>
        <div class="panel"><h3>DRS</h3><canvas id="c-drs"></canvas></div>
      </div>
      <div class="track-wrap">
        <h3 id="track-title">Track — coloured by speed</h3>
        <canvas id="c-track"></canvas>
        <div class="colorbar"></div>
        <div class="colorbar-labels"><span id="cb-lo">slow</span><span id="cb-hi">fast</span></div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let data = null;          // full API payload
let speedMin = 0, speedMax = 300;  // for the track colour ramp

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("load").disabled = true;
  $("status").textContent = "Loading… (first time downloads telemetry, please wait)";
  const q = new URLSearchParams({
    year:$("year").value, event:$("event").value, session:$("session").value,
    driver:$("driver").value.trim(), lap:($("lap").value.trim() || "fastest"),
  });
  const d2 = $("driver2").value.trim();
  if (d2) q.set("driver2", d2);
  try {
    const res = await fetch("/api/telemetry?" + q);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    data = d;
    const tag = c => `${c.driver} L${c.lap ?? "?"} ${fmtLap(c.lap_time_s)}`;
    $("status").textContent =
      d.cars.map(tag).join("  vs  ") + (d.cached ? "  · cached" : "  · freshly built");
    renderLegend();
    drawAll();
    $("stage").classList.add("show");
    // canvases have zero width until shown, so size+draw again now they're laid out
    requestAnimationFrame(drawAll);
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  } finally {
    $("load").disabled = false;
  }
});

function fmtLap(s){
  if (s == null) return "";
  const m = Math.floor(s/60), sec = (s - m*60).toFixed(3).padStart(6,"0");
  return `${m}:${sec}`;
}

function renderLegend(){
  $("legend").innerHTML = data.cars.map(c =>
    `<span class="chip"><span class="sw" style="background:${c.color}"></span>
       <b>${c.driver}</b> <span class="t">${fmtLap(c.lap_time_s)}</span></span>`).join("");
}

// --- shared canvas helpers (same DPR/resize approach as track.html) ---
function fitCanvas(cv, cssH){
  const cssW = cv.parentElement.clientWidth - 28; // minus panel padding
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, cssW) * dpr;
  cv.height = cssH * dpr;
  cv.style.height = cssH + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, w: Math.max(1, cssW), h: cssH };
}

// Map a value range to pixel range with padding for axes.
function makeScales(w, h, xmin, xmax, ymin, ymax, padL, padB){
  const padT = 8, padR = 8;
  const sx = v => padL + (v - xmin)/(xmax - xmin) * (w - padL - padR);
  const sy = v => padT + (1 - (v - ymin)/(ymax - ymin)) * (h - padT - padB);
  return { sx, sy, padL, padR, padT, padB };
}

function axisStyle(ctx){ ctx.strokeStyle = "#2a2a3a"; ctx.lineWidth = 1; ctx.fillStyle = "#8a8a9a";
  ctx.font = "10px -apple-system,sans-serif"; }

// Draw one distance-axis line chart. `pick` extracts the channel array; `step`
// makes brake/drs render as square steps (digital signals) instead of slopes.
function lineChart(cv, key, cssH, ymin, ymax, { step=false, yticks=[], baselineZero=false }={}){
  const { ctx, w, h } = fitCanvas(cv, cssH);
  ctx.clearRect(0,0,w,h);
  const xmax = chartXMax();
  const padL = 34, padB = 16;
  const sc = makeScales(w, h, 0, xmax, ymin, ymax, padL, padB);
  axisStyle(ctx);
  // y gridlines + labels
  (yticks.length ? yticks : [ymin, (ymin+ymax)/2, ymax]).forEach(t => {
    const y = sc.sy(t);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - sc.padR, y); ctx.stroke();
    ctx.fillText(String(t), 4, y + 3);
  });
  // zero baseline emphasis for the delta chart
  if (baselineZero && ymin < 0 && ymax > 0){
    ctx.strokeStyle = "#3a3a4a"; ctx.lineWidth = 1;
    const y0 = sc.sy(0); ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(w-sc.padR,y0); ctx.stroke();
  }
  // x label (distance)
  ctx.fillStyle = "#8a8a9a"; ctx.fillText(Math.round(xmax) + " m", w - 44, h - 3);
  ctx.fillText("0", padL, h - 3);
  // one trace per car (overlay), team-coloured
  data.cars.forEach(c => {
    const ch = c.channels, xs = ch.dist, ys = ch[key];
    ctx.strokeStyle = c.color; ctx.lineWidth = 1.6; ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i=0;i<xs.length;i++){
      const px = sc.sx(xs[i]), py = sc.sy(ys[i]);
      if (i===0){ ctx.moveTo(px,py); continue; }
      if (step){ ctx.lineTo(sc.sx(xs[i]), sc.sy(ys[i-1])); } // horizontal then vertical
      ctx.lineTo(px,py);
    }
    ctx.stroke();
  });
}

// The shared x-axis spans the longest lap so both traces fit.
function chartXMax(){
  return Math.max(...data.cars.map(c => c.channels.dist[c.channels.dist.length-1]));
}

function deltaChart(){
  const cv = $("c-delta");
  if (!data.delta){ $("p-delta").style.display = "none"; return; }
  $("p-delta").style.display = "";
  const { ctx, w, h } = fitCanvas(cv, 70);
  ctx.clearRect(0,0,w,h);
  const d = data.delta;
  const xmax = chartXMax();
  const amax = Math.max(8, Math.ceil(Math.max(...d.speed_delta.map(Math.abs))));
  const padL = 34, padB = 16;
  const sc = makeScales(w, h, 0, xmax, -amax, amax, padL, padB);
  axisStyle(ctx);
  [-amax, 0, amax].forEach(t => { const y = sc.sy(t);
    ctx.strokeStyle = t===0 ? "#3a3a4a" : "#2a2a3a";
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-sc.padR,y); ctx.stroke();
    ctx.fillStyle="#8a8a9a"; ctx.fillText((t>0?"+":"")+t, 4, y+3); });
  // Fill above zero in driver1's colour, below in driver2's — shows who's faster where.
  const y0 = sc.sy(0);
  const c1 = data.cars[0].color, c2 = data.cars[1] ? data.cars[1].color : "#888";
  ctx.beginPath(); ctx.moveTo(sc.sx(d.dist[0]), y0);
  d.dist.forEach((x,i)=> ctx.lineTo(sc.sx(x), sc.sy(d.speed_delta[i])));
  ctx.lineTo(sc.sx(d.dist[d.dist.length-1]), y0); ctx.closePath();
  // crude two-tone: clip isn't worth it; use a translucent driver1 fill + line
  ctx.fillStyle = hexA(c1, .18); ctx.fill();
  ctx.strokeStyle = c1; ctx.lineWidth = 1.4; ctx.beginPath();
  d.dist.forEach((x,i)=> { const px=sc.sx(x), py=sc.sy(d.speed_delta[i]);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }); ctx.stroke();
  ctx.fillStyle = "#8a8a9a"; ctx.fillText(Math.round(xmax)+" m", w-44, h-3);
}
function hexA(hex, a){ const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

// --- track map coloured by speed ---
// Blue (slow) -> teal -> yellow -> orange -> red (fast). Matches the .colorbar.
function speedColor(v){
  const t = Math.max(0, Math.min(1, (v - speedMin)/(speedMax - speedMin)));
  const stops = [[0x2b,0x6b,0xff],[0x00,0xd2,0xbe],[0xf2,0xd6,0x00],[0xff,0x7a,0x00],[0xe1,0x06,0x00]];
  const seg = t * (stops.length-1); const i = Math.min(stops.length-2, Math.floor(seg)); const f = seg - i;
  const a = stops[i], b = stops[i+1];
  const ch = k => Math.round(a[k] + (b[k]-a[k])*f);
  return `rgb(${ch(0)},${ch(1)},${ch(2)})`;
}

function drawTrack(){
  const t = data.track;
  speedMin = Math.min(...t.speed); speedMax = Math.max(...t.speed);
  $("cb-lo").textContent = Math.round(speedMin) + " km/h";
  $("cb-hi").textContent = Math.round(speedMax) + " km/h";
  $("track-title").textContent = `Track — coloured by ${data.cars[0].driver}'s speed`;
  const cv = $("c-track");
  const [minx,miny,maxx,maxy] = t.bounds;
  const dw = maxx-minx, dh = maxy-miny;
  // size the canvas to the track aspect ratio, capped
  const cssW = cv.parentElement.clientWidth - 28;
  const cssH = Math.min(Math.max(220, cssW * (dh/dw)), 460);
  const { ctx, w, h } = fitCanvas(cv, cssH);
  ctx.clearRect(0,0,w,h);
  const pad = 18;
  const scale = Math.min((w-2*pad)/dw, (h-2*pad)/dh);
  const ox = (w - dw*scale)/2 - minx*scale, oy = (h - dh*scale)/2 - miny*scale;
  const X = x => x*scale + ox, Y = y => y*scale + oy;
  ctx.lineJoin = ctx.lineCap = "round"; ctx.lineWidth = 5;
  // Draw each segment with the colour of its starting point's speed.
  for (let i=1;i<t.x.length;i++){
    ctx.beginPath();
    ctx.moveTo(X(t.x[i-1]), Y(t.y[i-1]));
    ctx.lineTo(X(t.x[i]), Y(t.y[i]));
    ctx.strokeStyle = speedColor(t.speed[i-1]);
    ctx.stroke();
  }
}

function drawAll(){
  if (!data) return;
  lineChart($("c-speed"), "speed", 150, 0, Math.ceil(speedTop()/20)*20, { yticks: speedTicks() });
  deltaChart();
  lineChart($("c-throttle"), "throttle", 64, 0, 100, { yticks:[0,50,100] });
  lineChart($("c-brake"), "brake", 50, 0, 1, { step:true, yticks:[0,1] });
  lineChart($("c-gear"), "gear", 70, 1, 8, { step:true, yticks:[1,4,8] });
  lineChart($("c-drs"), "drs", 50, 0, 1, { step:true, yticks:[0,1] });
  drawTrack();
}

function speedTop(){ return Math.max(...data.cars.flatMap(c => c.channels.speed)); }
function speedTicks(){ const top = Math.ceil(speedTop()/20)*20; return [0, top/2, top]; }

window.addEventListener("resize", () => { if (data) drawAll(); });
</script>
</body>
</html>
